name: Build & Release Android APK

on:
  push:
    branches: [ main ]
    paths:
      - 'mobile/**'
      - '.github/workflows/build-apk.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'mobile/**'
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish release with APK asset'
        required: false
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  test-and-lint:
    name: Run Test Suites
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: 'backend/requirements.txt'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Run Backend Pytest
        run: |
          cd backend
          python -m pytest -v
        env:
          PYTHONPATH: .

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Run Mobile Jest Tests
        run: |
          cd mobile
          npm test

      - name: Run Mobile TypeScript Check
        run: |
          cd mobile
          npx tsc --noEmit

  build-android-apk:
    name: Build Standalone Android APK
    needs: [test-and-lint]
    runs-on: ubuntu-latest
    env:
      EXPO_PUBLIC_API_URL: "https://devlense.onrender.com"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'mobile/package.json'

      - name: Set up JDK 17 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses
        run: |
          if command -v sdkmanager >/dev/null 2>&1; then
            yes | sdkmanager --licenses || true
          elif [ -f "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          npm install

      - name: Generate Native Android Project (Expo Prebuild)
        run: |
          cd mobile
          npx expo prebuild --platform android --clean --no-install

      - name: Build Standalone Offline APK (Release Bundle)
        run: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Prepare APK Asset
        id: prepare_apk
        run: |
          mkdir -p artifacts
          cp mobile/android/app/build/outputs/apk/release/app-release.apk artifacts/devlens-v0.1.0.apk
          echo "apk_path=artifacts/devlens-v0.1.0.apk" >> "$GITHUB_OUTPUT"

      - name: Upload APK to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: devlens-android-apk
          path: artifacts/devlens-v0.1.0.apk
          retention-days: 30

      - name: Publish GitHub Release with APK
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.0-apk
          name: "DevLens Android APK v0.1.0"
          draft: false
          prerelease: false
          make_latest: true
          files: artifacts/devlens-v0.1.0.apk
          body: |
            ## 📱 DevLens Android APK Download

            The standalone Android APK for DevLens has been compiled by GitHub Actions.
            This APK includes the pre-packaged offline JavaScript bundle and runs without a development server.

            ### How to Install on your Phone:
            1. Open this page on your Android phone's browser.
            2. Tap **`devlens-v0.1.0.apk`** below to download.
            3. Tap the downloaded file to install.
            4. If prompted:
               - **"Install unknown apps"**: Tap *Settings* and toggle *Allow from this source*.
               - **"Play Protect warning"**: Tap *More details* -> *Install anyway*.
            5. Open DevLens and start debugging!
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate Summary
        run: |
          echo "### 🚀 Android APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **Artifact:** \`devlens-v0.1.0.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Offline bundle embedded. Ready for direct phone installation." >> $GITHUB_STEP_SUMMARY
